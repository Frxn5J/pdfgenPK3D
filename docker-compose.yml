version: '3.8'

services:
  catalog:
    build: .
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - catalog_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
    depends_on:
      - flaresolverr

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: always
    # Sin mapeo de puertos al host: solo accesible por la red interna de compose
    # (el servicio "catalog" lo alcanza vía http://flaresolverr:8191).
    expose:
      - "8191"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - LOG_LEVEL=info
      - BROWSER_TIMEOUT=90000
      - TZ=America/Mexico_City
      - HOST=0.0.0.0
      - PORT=8191

volumes:
  catalog_data:
